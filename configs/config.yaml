# 进程运行时配置（Gateway / 后续业务代码用 Viper 读取）。
# 不是 Docker 启动文件：Postgres / Redis / Kafka 怎么拉起，看 deploy/docker-compose.yaml。
# 密码 xnc123 仅本地演示，生产不要提交真实密钥。

server:
  port: 8199
  cors_origins:
    - http://localhost:8080
    - http://127.0.0.1:8080

database:
  host: localhost
  port: 5432
  username: xnc
  password: xnc123
  dbname: xncagent
  sslmode: disable       # 本地开发用 disable，生产环境按需改为 require/verify-full
  timezone: Asia/Shanghai
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: localhost:6379
  password: ""
  db: 0

# 163 邮箱 SMTP：登录网页邮箱 → 设置 → POP3/SMTP/IMAP → 开启 SMTP，
# password 填「授权码」而不是登录密码。也可用环境变量 SMTP_USERNAME / SMTP_PASSWORD 覆盖。
smtp:
  host: smtp.163.com
  port: 465
  username: your_account@163.com
  password: ""
  from: jiao_snow@163.com

kafka:
  brokers:
    - localhost:9093     # 宿主机端口；容器内互访用 kafka:9092

jwt:
  secret: local-dev-only-not-for-production
